name: CI

on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
  workflow_dispatch:

concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions: # needed to allow julia-actions/cache to proactively delete old caches that it has created
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        version:
          # Aliases, so that no release of Julia calls for an edit here: 'min' is
          # the latest patch of the oldest minor that `julia` admits in
          # Project.toml, '1' the latest release, which also measures the
          # coverage on ubuntu (keep it, or move the coverage conditions below
          # with it), and 'nightly' the master branch.
          - 'min'
          - '1'
          - 'nightly'
        os:
          - ubuntu-latest
          - windows-latest
        arch:
          - x64

    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        id: julia
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v3
        with:
          # The key holds the matrix, whose aliases stay the same when Julia
          # changes: it names the installed version too, so that a new release
          # starts its own depot instead of carrying the old `compiled/` along.
          cache-name: julia-cache;workflow=${{ github.workflow }};job=${{ github.job }};julia=${{ steps.julia.outputs.julia-version }}
      # The Pkg server intermittently advertises a General tree hash that its
      # CDN then answers with a 404, which kills the first `Pkg.add` of a cold
      # depot before any of this repository's code runs.  Install the registry
      # up front and fall back to a direct clone when that happens; package
      # tarballs keep going through the Pkg server either way.
      - name: Install the General registry
        shell: julia --color=yes {0}
        run: |
          using Pkg
          regdir = joinpath(first(DEPOT_PATH), "registries")
          if isdir(joinpath(regdir, "General")) || isfile(joinpath(regdir, "General.tar.gz"))
              @info "General registry already installed"
          else
              try
                  Pkg.Registry.add("General")
              catch err
                  @warn "Pkg server could not serve the registry; cloning from GitHub" err
                  withenv("JULIA_PKG_SERVER" => "") do
                      Pkg.Registry.add(Pkg.RegistrySpec(url = "https://github.com/JuliaRegistries/General.git"))
                  end
              end
          end
      # The cache restores the depot's packages, Conda's deps/deps.jl among them,
      # but not ~/.julia/conda, the root environment that file names: on a new
      # release of Julia, Conda is precompiled again and fails on the missing
      # directory. Building Conda first makes that directory again. PyCall is
      # added with the bound of the test environment (1.97.0 crashes in SymPy's
      # hash without the GIL), so that the release built here is the one the tests
      # resolve to.
      - name: Install dependencies
        run: |
          julia -e '
            using Pkg
            ENV["PYTHON"] = ""
            withenv(() -> Pkg.add("Conda"), "JULIA_PKG_PRECOMPILE_AUTO" => "0")
            Pkg.build("Conda")
            Pkg.add(PackageSpec(name = "PyCall", version = Pkg.Types.semver_spec("< 1.97.0, >= 1.97.1")))
            Pkg.add("SymPy")
            # conda-forge now and then answers a transient error (a 502 on its index):
            # what is downloaded from it is tried three times, a minute apart
            retry(() -> Pkg.build("PyCall"); delays = fill(60.0, 2))()
            using PyCall
            retry(() -> pyimport_conda("sympy", "sympy"); delays = fill(60.0, 2))()'
      - uses: julia-actions/julia-buildpkg@v1
      # IrrationalConstants, a dependency of ForwardDiff, calls MPFR under the
      # bare name `:libmpfr`, and the Windows builds of Julia master no longer
      # install the unversioned `libmpfr.dll` (JuliaLang/julia#63686): the
      # package fails to precompile there, and TensND with it. Its fix is the
      # versioned name `Base.MPFR.libmpfr`, which Base's own `@irrational`
      # reads; it is applied to the copy installed here until a release of
      # IrrationalConstants carries it, after which this step changes nothing.
      - name: Load MPFR by its versioned name in IrrationalConstants
        if: runner.os == 'Windows' && matrix.version == 'nightly'
        shell: julia --color=yes {0}
        run: |
          root = joinpath(first(DEPOT_PATH), "packages", "IrrationalConstants")
          for dir in (isdir(root) ? readdir(root; join = true) : String[])
              file = joinpath(dir, "src", "macro.jl")
              isfile(file) || continue
              src = read(file, String)
              occursin(":libmpfr),", src) || continue
              chmod(file, 0o644)
              write(file, replace(src, ":libmpfr)," => "Base.MPFR.libmpfr),"))
              @info "IrrationalConstants now loads MPFR by its versioned name" file
          end
      - uses: julia-actions/julia-runtest@v1
        with:
          # Instrument only the ubuntu job on the latest release: coverage
          # disables precompilation caching and would slow down every other
          # matrix entry for nothing.
          coverage: ${{ matrix.os == 'ubuntu-latest' && matrix.version == '1' }}
      # Not julia-actions/julia-processcoverage: see the header of the script
      # for why its `amend_coverage_from_src!` step misreports this package.
      - name: Process coverage
        if: matrix.os == 'ubuntu-latest' && matrix.version == '1'
        shell: julia --color=yes {0}
        run: |
          using Pkg
          Pkg.activate(; temp = true)
          Pkg.add("Coverage")
          # `pwd()` is the workspace root.  An absolute path is required: the
          # `run:` block is written to a temp file by the runner, and `include`
          # resolves relative to THAT file's directory, not the cwd.
          include(joinpath(pwd(), ".github", "scripts", "coverage.jl"))
      - uses: codecov/codecov-action@v7
        if: matrix.os == 'ubuntu-latest' && matrix.version == '1'
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
