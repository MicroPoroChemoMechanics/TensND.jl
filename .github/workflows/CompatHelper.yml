name: CompatHelper
on:
  schedule:
    - cron: 0 0 * * *
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  CompatHelper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The Pkg server intermittently advertises a General tree hash that its
      # CDN then answers with a 404, which kills the first `Pkg.add` of a cold
      # depot before any of this repository's code runs.  Install the registry
      # up front and fall back to a direct clone when that happens; package
      # tarballs keep going through the Pkg server either way.
      - name: Install the General registry
        shell: julia --color=yes {0}
        run: |
          using Pkg
          regdir = joinpath(first(DEPOT_PATH), "registries")
          if isdir(joinpath(regdir, "General")) || isfile(joinpath(regdir, "General.tar.gz"))
              @info "General registry already installed"
          else
              try
                  Pkg.Registry.add("General")
              catch err
                  @warn "Pkg server could not serve the registry; cloning from GitHub" err
                  withenv("JULIA_PKG_SERVER" => "") do
                      Pkg.Registry.add(Pkg.RegistrySpec(url = "https://github.com/JuliaRegistries/General.git"))
                  end
              end
          end
      - name: Pkg.add("CompatHelper")
        run: julia -e 'using Pkg; Pkg.add("CompatHelper")'
      # `subdirs` defaults to the root `Project.toml` alone, which leaves the
      # documentation (and, where it exists, the test) environment unwatched.
      # Those are exactly where a temporary bound on a broken upstream release
      # gets parked, so without this they would be pinned and then forgotten.
      # CompatHelper opens a pull request as soon as a version outside the bound
      # is registered; that pull request's CI is the answer to "is upstream
      # fixed yet?" — red means keep the bound, green means delete it.
      - name: CompatHelper.main()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMPATHELPER_PRIV: ${{ secrets.DOCUMENTER_KEY }}
        run: julia -e 'using CompatHelper; CompatHelper.main(; subdirs = ["", "docs"])'
