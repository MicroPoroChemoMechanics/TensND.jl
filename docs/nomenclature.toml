# The symbols of the documentation's formulas: the page `nomenclature.md` lists
# them, and hovering an equation shows those it holds. Ported from
# MeanFieldHomogenization, itself ported from ChemistryLab.
#
# One entry per meaning of a symbol.
#
#   tex       the symbol as the formulas write it, matched in their TeX source
#             (see `src/.vitepress/nomenclature-match.mjs`: an upright label such
#             as \mathrm{grad} is a symbol of its own, a subscript is not a
#             superscript, and an index i, j, k stands for any of them);
#   label     how the page and the hint print it (HTML: <sub>, <sup>, <b>, <u>);
#   name      what it is;
#   unit      its SI unit when it has one ("1" for a number without one, "" for
#             a tensor or a coordinate whose unit depends on what it describes);
#   pages     where this meaning holds: paths under docs/src, a folder ending
#             in "/" for all of its pages. An entry without `pages` holds on
#             every page where no entry of the same `tex` is scoped;
#   group     the section of the page.
#
# A letter that means different things on different pages (R, K, α, ℂ, ...) has
# no entry that holds everywhere: each meaning is restricted to the pages where
# it was read, and elsewhere the hint is silent rather than wrong.
#
# A symbol has at most one unscoped entry, every page named exists, and two
# entries never carry the same name: test/test_docs_nomenclature.jl checks it.

